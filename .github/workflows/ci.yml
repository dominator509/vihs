name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: sh scripts/install.sh

      - name: Start dev services
        run: sh scripts/dev-services.sh up

      - name: Full verification
        run: sh scripts/verify.sh

      # EP-007 M5 (GAP-M5-4): chaos + capacity are EXPLICIT steps so a
      # failure in the fault-injection suite or the load harness is
      # distinguishable in the workflow UI (they also run inside
      # verify.sh — these steps are the named, visible gate).
      - name: Chaos suite (fault injection, SPEC-006)
        run: sh scripts/chaos.sh

      - name: Capacity load harness (CI mode)
        run: sh scripts/loadtest-capacity.sh

      - name: Production readiness (automated subset)
        run: sh scripts/production-readiness-check.sh
