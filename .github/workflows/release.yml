name: release

# EP-009 M3: tag → artifacts + image → GHCR push. The staging deploy gate
# (M4) is a manual `workflow_dispatch` step so an operator with
# RUNPOD_API_KEY can trigger it; release itself never deploys autonomously
# (AGENTS.md STOP S6 — staging only, prod requires operator approval).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      staging:
        description: "Run staging deploy gate (requires RUNPOD_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: sh scripts/install.sh

      - name: Full verification on the tag
        run: sh scripts/verify.sh

      - name: Build release artifacts
        run: sh scripts/build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push pod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/pod.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/vihs-pod:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/vihs-pod:latest

      - name: Attach artifacts to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Binaries + pod wheel from the build step.
          mkdir -p dist
          cp target/release/orchestrator target/release/memoryd target/release/chain-fsck dist/ 2>/dev/null || true
          cp target/pod-dist/*.whl dist/ 2>/dev/null || true
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber
          else
            gh release create "${{ github.ref_name }}" dist/* \
              --title "VIHS ${{ github.ref_name }}" \
              --notes "See CHANGELOG.md for ${{ github.ref_name }}."
          fi

  staging-gate:
    # EP-009 M4: deploy control plane + one real pod; real-stage smoke.
    # Only runs when explicitly dispatched AND RUNPOD_API_KEY is configured.
    if: inputs.staging == true
    needs: release
    runs-on: ubuntu-24.04
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy staging + smoke
        run: |
          set -eu
          if [ -z "${RUNPOD_API_KEY:-}" ]; then
            echo "RUNPOD_API_KEY secret not configured — staging gate SKIPPED (EP-009 S1)"
            exit 0
          fi
          # deploy/runpod/staging-deploy.sh is filled in EP-009 M4; until then
          # the gate is a documented placeholder that only runs with the key.
          if [ -x deploy/runpod/staging-deploy.sh ]; then
            sh deploy/runpod/staging-deploy.sh "${{ github.ref_name }}"
          else
            echo "staging-deploy.sh not yet present (EP-009 M4) — gate placeholder"
          fi
