[workspace]
resolver = "2"
members = ["crates/vihs-core", "crates/memoryd", "crates/orchestrator", "crates/mcpd"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
