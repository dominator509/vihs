# VIHS local dev services — Redis 7 + MinIO + bucket init.
# Idempotent: `dev-services.sh up` may be re-run freely.
# Observability stack (prometheus + grafana) behind the `obs` profile —
# `dev-services.sh up-obs`; dev only (EP-008 M3).
services:
  redis:
    image: redis:7-alpine
    ports:
      - "${VIHS_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${VIHS_S3_PORT:-9000}:9000"
      - "${VIHS_S3_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${VIHS_S3_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${VIHS_S3_SECRET_KEY:-minioadmin}"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 2s
      retries: 30

  mc:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${VIHS_S3_ACCESS_KEY:-minioadmin} ${VIHS_S3_SECRET_KEY:-minioadmin} >/dev/null 2>&1; do sleep 1; done;
      mc mb -p local/${VIHS_S3_BUCKET:-vihs-sessions};
      mc anonymous set download local/${VIHS_S3_BUCKET:-vihs-sessions} >/dev/null 2>&1 || true;
      echo 'bucket ready';
      "
    depends_on:
      minio:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["obs"]
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:${VIHS_OBS_PROM_PORT:-9090}
    volumes:
      - ./../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./../observability/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["obs"]
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${VIHS_OBS_GRAFANA_PORT:-3100}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./../observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./../observability/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
