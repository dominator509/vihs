[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vihs-pod"
version = "0.1.0"
description = "VIHS pod agent — real-time avatar pipeline data plane"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["vihs_pod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires dev services (Redis/MinIO)",
    "e2e: full loopback run",
]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
